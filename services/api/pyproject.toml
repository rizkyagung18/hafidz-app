[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hafidz-api"
version = "0.1.0"
description = "FastAPI backend for Hafidz App, a Muslim daily companion"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.6,<5",
  "fastapi>=0.115,<1.0",
  "av>=14,<19",
  "faster-whisper>=1.1,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "rapidfuzz>=3.11,<4.0",
  "redis>=5.2,<7.0",
  "scikit-learn>=1.6,<2.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.8,<1.0",
  "schemathesis>=4.0,<5.0",
]
model-conversion = [
  "ctranslate2>=4.8,<5.0",
  "huggingface-hub>=0.28,<2.0",
  "torch>=2.7,<3.0",
  "transformers>=4.50,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
