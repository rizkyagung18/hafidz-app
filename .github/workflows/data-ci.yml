name: Quran data validation

on:
  push:
    paths:
      - "tools/build_quran_db/**"
      - "apps/mobile/assets/db/**"
      - "services/api/app/matching/normalize.py"
      - "services/api/pyproject.toml"
      - "services/api/uv.lock"
      - "docs/06-DATA-MODEL.md"
      - ".github/workflows/data-ci.yml"
  pull_request:
    paths:
      - "tools/build_quran_db/**"
      - "apps/mobile/assets/db/**"
      - "services/api/app/matching/normalize.py"
      - "services/api/pyproject.toml"
      - "services/api/uv.lock"
      - "docs/06-DATA-MODEL.md"
      - ".github/workflows/data-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quran-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-quran-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5

      - name: Install API and data-builder dependencies
        working-directory: services/api
        run: uv sync --locked --extra dev

      - name: Test QUL 1405H audit and local proof generators
        run: uv run --project services/api python -m unittest tools.build_quran_db.test_audit_qul_1405h tools.build_quran_db.test_preview_qul_1405h
      # The pinned QUL ZIPs and generated assets stay local pending rights review.
      # Full build.py, verify.py, and build_index.py checks run on developer machines.
