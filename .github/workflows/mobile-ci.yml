name: Mobile analysis

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: dart run build_runner build
      - working-directory: apps/mobile
        run: dart analyze lib
      - working-directory: apps/mobile
        run: dart analyze test
      # Flutter test bundles assets declared in pubspec.yaml, including the
      # local QUL database and fonts. Run the full suite on developer machines
      # until those assets can be distributed to CI.
