name: hafidz_app
description: Muslim daily companion app — Qur'an, prayer, Voice Ayah Finder.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  go_router: ^15.1.2
  intl: any
  path: ^1.9.1
  path_provider: ^2.1.5
  record: ^7.1.1
  scrollable_positioned_list: ^0.3.8
  share_plus: 11.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.8.0
  drift_dev: ^2.35.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  very_good_analysis: ^9.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/db/
    - assets/mushaf/
    - assets/mushaf/fonts/
    - assets/mushaf/headers/

  fonts:
    - family: Me Quran
      fonts:
        - asset: assets/fonts/MeQuran.ttf
